<!DOCTYPE html>
<html>
<head>
  <title>Tag Validator</title>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      padding: 40px;
    }

    h2 {
      margin-top: 0px;
    }

    button {
      padding: 14px 24px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #3b82f6;
      color: white;
      margin-right: 10px;
    }

    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    .status {
      margin: 15px 0;
      color: #cbd5f5;
    }

    .product {
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .tags {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      background: #334155;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
    }

    .open-btn {
      margin-top: 10px;
      display: inline-block;
      background: #22c55e;
      padding: 8px 12px;
      border-radius: 6px;
      text-decoration: none;
      color: white;
      font-size: 13px;
    }

    .section {
      margin-top: 30px;
      padding: 20px;
      background: #020617;
      border-radius: 12px;
    }
  </style>
</head>
<body>

<div class="section">
  <h2> Fitment Data Sync
</h2>
  <button id="fitment-sync-btn">Start Fitment Data Sync</button>

  <div class="status" id="fitmentSyncStatusText"></div>
</div>


<!-- 🔵 LIVE RUN SECTION -->
<div class="section">
  <h2> Tag Correction & Partial OEM SKU Generation
</h2>
  <button id="btn">Start Process</button>

  <div class="status" id="statusText"></div>
</div>


<!-- PRODUCT FILTER CONFIGURATION -->
<div class="section">
  <h2>Product Filters Configuration</h2>

  <div id="filters-container"></div>

  <button id="add-filter-btn" type="button">
    + Add Filter
  </button>

  <button id="save-filters-btn" type="button" disabled>
    Save Changes
  </button>

  <div class="status" id="filter-settings-status"></div>
</div>

<!-- ADD FILTER POPUP -->
<dialog id="add-filter-dialog">
  <h3>Add Product Filter</h3>

  <select id="available-filters-select">
    <option value="">Select a metafield</option>
  </select>

  <div style="margin-top: 20px;">
    <button id="confirm-add-filter-btn" type="button">
      Add Filter
    </button>

    <button id="close-filter-dialog-btn" type="button">
      Cancel
    </button>
  </div>
</dialog>


<!-- 🟢 RECENT RUNS SECTION -->
<div class="section">
  <h2>Update Logs</h2>
  <button id="download-full-change-logs">Download Full Change Logs</button>
</div>

<script>

const fitmentSyncBtn = document.getElementById('fitment-sync-btn')


fitmentSyncBtn.onclick = async () => {
  fitmentSyncBtn.disabled = true;
  fitmentSyncStatusText.textContent = "Fitment sync running...";

  try {
    const response = await fetch("/sync-fitment-data");
    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Fitment sync failed.");
    }

    fitmentSyncStatusText.textContent = result.skipped
      ? "Fitment sync is already running."
      : result.message;
  } catch (err) {
    fitmentSyncStatusText.textContent = `Error: ${err.message}`;
  } finally {
    fitmentSyncBtn.disabled = false;
  }
};


const btn = document.getElementById("btn");
const viewBtn = document.getElementById("viewResultsBtn");
const statusText = document.getElementById("statusText");
const resultsDiv = document.getElementById("results");

const SHOP = "eurowagens-com.myshopify.com";

let polling = false;


async function initializeState() {
  try {
    btn.disabled = true;

    const res = await fetch("/status");
    const data = await res.json();

    if (data.status === "running") {
      // 🔒 LOCK UI
      btn.disabled = true;
      btn.innerText = "Processing...";
      statusText.innerText = data.message || "Processing...";

      polling = true;

      // 🔁 resume polling
      const interval = setInterval(() => {
        if (!polling) {
          clearInterval(interval);
          return;
        }
        fetchStatus();
      }, 1000);
    } else {
      // idle or completed
      btn.disabled = false;
      btn.innerText = "Start Process";
      statusText.innerText = "";
    }

  } catch {
    statusText.innerText = "Error initializing state";
  }
}

// 🔁 LOAD RESULTS FUNCTION (reusable)
async function loadResults(label = "Last Run Results") {
  const res = await fetch("/results");
  const products = await res.json();

  resultsDiv.innerHTML = `<h3>${label}</h3>`;

  if (!products.length) {
    resultsDiv.innerHTML += "<p>No invalid tags found</p>";
    return;
  }

  products.forEach(product => {
    const numericId = product.id.split("/").pop();

    const html = `
      <div class="product">
        <div><strong>ID:</strong> ${numericId}</div>

        <div class="tags">
          ${product.tags.map(tag => `<span class="tag">${tag}</span>`).join("")}
        </div>

        <a class="open-btn" target="_blank"
          href="https://${SHOP}/admin/products/${numericId}">
          Open in Shopify →
        </a>
      </div>
    `;

    resultsDiv.innerHTML += html;
  });
}


// ✅ ONLY poll AFTER clicking button
async function fetchStatus() {
  if (!polling) return;

  try {
    const res = await fetch("/status");
    const data = await res.json();

    if (data.status === "running") {
      btn.innerText = "Processing...";
      statusText.innerText = data.message || "Processing...";
    }

    if (data.status === "completed") {
      statusText.innerText = "Completed ✅";
      btn.disabled = false;
      btn.innerText = "Start Process";
      polling = false;

      // 🔥 AUTO REFRESH RESULTS AFTER COMPLETION
      loadResults("Last Run Results (Updated)");
    }

  } catch {
    statusText.innerText = "Error fetching status";
    polling = false;
  }
}


// ▶️ START NEW RUN
btn.onclick = async () => {
  btn.disabled = true;
  btn.innerText = "Starting...";
  statusText.innerText = "Starting new run...";

  await fetch("/initiate-bulk-operation");

  polling = true;

  const interval = setInterval(() => {
    if (!polling) {
      clearInterval(interval);
      return;
    }
    fetchStatus();
  }, 1000);
};


// 🟢 OPTIONAL: keep manual refresh button
viewBtn.onclick = () => loadResults("Last Run Results (Manual Refresh)");


// 🚀 LOAD RESULTS ON PAGE LOAD

initializeState();
loadResults();

</script>


<!-- for the modal -->

<script>


// 3. Get or create button
let viewAllBtn = document.getElementById("download-full-change-logs");

if (!viewAllBtn) {
  viewAllBtn = document.createElement("button");
  viewAllBtn.innerText = "View all Runs";
  document.body.appendChild(viewAllBtn);
}

// 4. Open modal + fetch data
viewAllBtn.onclick = async () => {
  
  const url = `/download-updates-log`;
  
  window.open(url, "_blank");

};


</script>



<!-- for filters -->

<script>
const filtersContainer = document.getElementById(
  "filters-container"
);

const addFilterBtn = document.getElementById(
  "add-filter-btn"
);

const saveFiltersBtn = document.getElementById(
  "save-filters-btn"
);

const filterSettingsStatus = document.getElementById(
  "filter-settings-status"
);

const addFilterDialog = document.getElementById(
  "add-filter-dialog"
);

const availableFiltersSelect = document.getElementById(
  "available-filters-select"
);

const confirmAddFilterBtn = document.getElementById(
  "confirm-add-filter-btn"
);

const closeFilterDialogBtn = document.getElementById(
  "close-filter-dialog-btn"
);

let selectedFilters = [];
let allAvailableFilters = [];

let originalSettings = "";

// --------------------------------------------------
// HELPERS
// --------------------------------------------------

function normalizeSortOrder() {
  selectedFilters.forEach((filter, index) => {
    filter.sort_order = index + 1;
  });
}

function getSettingsPayload() {
  const includedMetafields = {};

  selectedFilters.forEach((filter) => {
    includedMetafields[filter.key] = {
      label: filter.label,
      sort_order: filter.sort_order,
    };
  });

  return {
    included_metafields: includedMetafields,
  };
}

function hasChanges() {
  return (
    JSON.stringify(getSettingsPayload()) !== originalSettings
  );
}

function updateSaveButton() {
  saveFiltersBtn.disabled = !hasChanges();
}

// --------------------------------------------------
// RENDER SELECTED FILTERS
// --------------------------------------------------

function renderFilters() {
  filtersContainer.innerHTML = "";

  selectedFilters.forEach((filter, index) => {
    const item = document.createElement("div");
    item.className = "filter-item";

    const label = document.createElement("div");
    label.className = "filter-label";
    label.textContent = filter.label;

    const order = document.createElement("input");
    order.type = "number";
    order.className = "filter-order";
    order.min = 1;
    order.max = selectedFilters.length;
    order.value = filter.sort_order;
    order.title = "Sort order";

    // Update sort order manually.
    order.addEventListener("change", () => {
      const newOrder = Number(order.value);

      if (
        !Number.isInteger(newOrder) ||
        newOrder < 1 ||
        newOrder > selectedFilters.length
      ) {
        order.value = filter.sort_order;
        return;
      }

      const oldIndex = index;
      const newIndex = newOrder - 1;

      const [movedFilter] = selectedFilters.splice(
        oldIndex,
        1
      );

      selectedFilters.splice(
        newIndex,
        0,
        movedFilter
      );

      normalizeSortOrder();
      renderFilters();
      updateSaveButton();
    });

    // Move filter up.
    const upBtn = document.createElement("button");
    upBtn.type = "button";
    upBtn.className = "sort-filter-btn";
    upBtn.textContent = "↑";
    upBtn.disabled = index === 0;

    upBtn.onclick = () => {
      [
        selectedFilters[index - 1],
        selectedFilters[index],
      ] = [
        selectedFilters[index],
        selectedFilters[index - 1],
      ];

      normalizeSortOrder();
      renderFilters();
      updateSaveButton();
    };

    // Move filter down.
    const downBtn = document.createElement("button");
    downBtn.type = "button";
    downBtn.className = "sort-filter-btn";
    downBtn.textContent = "↓";
    downBtn.disabled = index === selectedFilters.length - 1;

    downBtn.onclick = () => {
      [
        selectedFilters[index],
        selectedFilters[index + 1],
      ] = [
        selectedFilters[index + 1],
        selectedFilters[index],
      ];

      normalizeSortOrder();
      renderFilters();
      updateSaveButton();
    };

    // Remove filter.
    const removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.className = "remove-filter-btn";
    removeBtn.textContent = "Remove";

    removeBtn.disabled = selectedFilters.length === 1;

    removeBtn.onclick = () => {
      if (selectedFilters.length <= 1) return;

      selectedFilters.splice(index, 1);

      normalizeSortOrder();
      renderFilters();
      updateSaveButton();
    };

    item.append(
      label,
      order,
      upBtn,
      downBtn,
      removeBtn
    );

    filtersContainer.appendChild(item);
  });

  // Prevent adding an unlimited number of filters.
  addFilterBtn.disabled =
    selectedFilters.length >= allAvailableFilters.length;

  updateAvailableFilters();
}

// --------------------------------------------------
// UPDATE AVAILABLE FILTERS
// --------------------------------------------------

function updateAvailableFilters() {
  availableFiltersSelect.innerHTML = "";

  const selectedKeys = new Set(
    selectedFilters.map((filter) => filter.key)
  );

  // const available = allAvailableFilters.filter(
  //   (filter) => !selectedKeys.has(filter.key)
  // );


const available = allAvailableFilters
  .filter((filter) => !selectedKeys.has(filter.key))
  .sort((a, b) =>
    a.label.localeCompare(b.label, undefined, {
      sensitivity: "base",
    })
  );

  const placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = "Select a metafield";

  availableFiltersSelect.appendChild(placeholder);

  available.forEach((filter) => {
    const option = document.createElement("option");

    option.value = filter.key;
    option.textContent = filter.label;

    availableFiltersSelect.appendChild(option);
  });

  confirmAddFilterBtn.disabled = available.length === 0;
}

// --------------------------------------------------
// LOAD FILTER SETTINGS
// --------------------------------------------------

async function loadFilterSettings() {
  try {
    filterSettingsStatus.textContent =
      "Loading filter settings...";

    const response = await fetch("/get-filter-settings");

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(
        result.message || "Failed to load filter settings."
      );
    }

    selectedFilters = result.data.selected_filters || [];

    allAvailableFilters =
      result.data.all_available_filters || [];

    selectedFilters.sort(
      (a, b) => a.sort_order - b.sort_order
    );

    normalizeSortOrder();

    originalSettings = JSON.stringify(
      getSettingsPayload()
    );

    renderFilters();

    filterSettingsStatus.textContent = "";
  } catch (error) {
    console.error(error);

    filterSettingsStatus.textContent =
      `Error: ${error.message}`;
  }
}

// --------------------------------------------------
// OPEN ADD FILTER POPUP
// --------------------------------------------------

addFilterBtn.onclick = () => {
  updateAvailableFilters();
  addFilterDialog.showModal();
};

closeFilterDialogBtn.onclick = () => {
  addFilterDialog.close();
};

// --------------------------------------------------
// ADD FILTER
// --------------------------------------------------

confirmAddFilterBtn.onclick = () => {
  const selectedKey = availableFiltersSelect.value;

  if (!selectedKey) return;

  const filter = allAvailableFilters.find(
    (item) => item.key === selectedKey
  );

  if (!filter) return;

  // Prevent duplicate filters.
  if (
    selectedFilters.some(
      (item) => item.key === selectedKey
    )
  ) {
    return;
  }

  selectedFilters.push({
    key: filter.key,
    label: filter.label,
    sort_order: selectedFilters.length + 1,
  });

  normalizeSortOrder();

  renderFilters();
  updateSaveButton();

  addFilterDialog.close();
};

// --------------------------------------------------
// SAVE FILTER SETTINGS
// --------------------------------------------------

saveFiltersBtn.onclick = async () => {
  try {
    saveFiltersBtn.disabled = true;

    filterSettingsStatus.textContent =
      "Saving filter settings...";

    const response = await fetch("/save-filter-settings", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify(getSettingsPayload()),
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(
        result.message || "Failed to save filter settings."
      );
    }

    originalSettings = JSON.stringify(
      getSettingsPayload()
    );

    filterSettingsStatus.textContent =
      "Filter settings saved successfully.";

  } catch (error) {
    console.error(error);

    filterSettingsStatus.textContent =
      `Error: ${error.message}`;
  } finally {
    updateSaveButton();
  }
};

// --------------------------------------------------
// INITIALIZE
// --------------------------------------------------

loadFilterSettings();
</script>

</body>
</html>
